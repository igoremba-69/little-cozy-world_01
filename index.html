<style>
*{box-sizing:border-box}body{margin:0;background:#f5ecdf;color:#202735;font-family:Arial,sans-serif}.app{min-height:100vh;padding:16px;background-image:radial-gradient(#b9dce4 2px,transparent 2px);background-size:28px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1450px;margin:auto}.logo{border:0;background:none;text-align:left;font-weight:900;line-height:.8;filter:drop-shadow(2px 3px white)}.logo small{display:block;color:#45aede;font-size:20px}.logo b{font-size:44px;color:#ffbd37;-webkit-text-stroke:2px #273b62}.logo em{font-style:normal;color:#b56ee1}.button{border:0;border-radius:17px;padding:12px 18px;background:white;box-shadow:0 4px 0 #cdbda9;font-weight:800;cursor:pointer}.top button{margin-left:6px}.save{background:#65ad92;color:white}.home{max-width:1450px;margin:18px auto;display:grid;grid-template-columns:430px 1fr;gap:25px}.menu{display:flex;flex-direction:column;gap:13px}.note{background:#fff8e8;padding:15px 18px;border-radius:18px;box-shadow:0 4px #e2d3bd}.item{display:flex;align-items:center;gap:14px;border:4px solid white;border-radius:24px;padding:15px 18px;box-shadow:0 5px #cbbba8;font-size:24px;font-weight:900;text-align:left;cursor:pointer}.item span{flex:1}.item small{display:block;font-size:13px;font-weight:500;margin-top:4px}.pink{background:#f59bad}.yellow{background:#ffd57c}.green{background:#9be0b5}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini button{border:0;background:#fff;padding:12px 4px;border-radius:15px;box-shadow:0 3px #d3c3b0;cursor:pointer}.mini small{display:block;font-size:12px;margin-top:5px}.room{min-height:650px;border:8px solid #c89467;border-radius:25px;background:linear-gradient(#fff7e8 0 59%,#c99b6e 59%);position:relative;overflow:hidden;box-shadow:0 9px #bba18a}.window{position:absolute;left:17%;right:17%;top:7%;height:35%;border:13px solid #b87847;background:linear-gradient(#65c5ef 0 65%,#9bd77a 65%);font-size:55px;text-align:right;padding:10px}.shelf{position:absolute;left:6%;top:8%;background:#a56c42;color:white;padding:12px 20px;border-radius:12px;font-size:30px;line-height:1.8}.desk{position:absolute;left:24%;right:17%;bottom:22%;height:155px;background:#b97943;border:8px solid #8b552f;border-radius:15px;padding:22px;transform:rotate(-2deg)}.paper{width:145px;height:88px;background:#fff8df;text-align:center;padding:18px;font-size:45px}.plants{position:absolute;bottom:20%;font-size:78px}.pl{left:4%}.pr{right:3%}.cat{position:absolute;bottom:8%;left:45%;font-size:90px}.rug{position:absolute;bottom:2%;left:31%;width:40%;height:70px;border-radius:50%;background:#efb0b9;text-align:center;font-size:50px;color:white}.screen{max-width:1450px;margin:20px auto}.head{display:flex;gap:12px;align-items:center;margin-bottom:16px}.head h1{flex:1}.studio{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}.canvasbox{background:white;border-radius:24px;padding:12px;min-height:600px;display:flex;align-items:center;justify-content:center;position:relative;touch-action:none;box-shadow:0 5px #d7c6b3;overflow:hidden}.canvasbox canvas{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;touch-action:none;cursor:crosshair}.tools{background:#fffaf2;border-radius:24px;padding:18px;box-shadow:0 5px #d7c6b3;height:max-content}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button,.tool{border:0;border-radius:13px;padding:12px;background:#eee5d9;font-weight:800;cursor:pointer}.active{background:#c8b5ff!important}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}.palette button{min-width:0}.palette button{aspect-ratio:1;border-radius:50%;border:2px solid white;box-shadow:0 2px 4px #0002;cursor:pointer;padding:0}.selected{outline:3px solid #333;outline-offset:2px}.tools label{display:block;font-weight:800;font-size:13px;margin:15px 0}.tools input{width:100%}.wide{width:100%;margin-top:12px}.pinktool{background:#f6b0bb}.greenbutton{background:#9cdbb5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.card{background:white;border-radius:20px;padding:12px;box-shadow:0 5px #d7c6b3}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card button{padding:8px;border:0;border-radius:10px;margin-right:5px}.hidden{display:none!important}@media(max-width:850px){.top{align-items:flex-start}.top-actions{display:flex;flex-direction:column}.home{grid-template-columns:1fr}.room{min-height:430px;order:-1}.studio{grid-template-columns:1fr}.canvasbox{min-height:0;padding:8px}.canvasbox canvas{max-height:none;width:100%;height:auto}.tools{width:100%;padding:12px;position:relative}.palette{grid-template-columns:repeat(8,1fr);gap:5px;margin:8px 0}.palette button{border-width:2px}.tabs{position:sticky;top:0;z-index:2}.logo b{font-size:32px}}
</style>
<div class="app"><header class="top"><button class="logo" onclick="home()"><small>Little</small><b>Cozy <em>World</em></b></button><div class="top-actions"><button class="button" onclick="file.click()">📁 Добавить картинку</button><button class="button save" onclick="savePNG()">Сохранить PNG</button></div></header><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<section id="homeScreen" class="home"><div class="menu"><div class="note">Твой уютный мир раскрасок</div><button class="item pink" onclick="openStudio()">🎨<span>Раскрашивать<small>Создавай свои шедевры!</small></span>›</button><button class="item yellow" onclick="gallery()">🖼️<span>Мои рисунки<small>Смотри и сохраняй</small></span>›</button><button class="item green" onclick="file.click()">🐱<span>Новые картинки<small>Открывай и раскрашивай</small></span>›</button><div class="mini"><button onclick="alert('Настройки будут добавлены следующим этапом')">⚙<small>Настройки</small></button><button onclick="alert('Родительский режим будет добавлен следующим этапом')">👨‍👩‍👧<small>Для родителей</small></button><button onclick="alert('Little Cozy World — MVP')">ⓘ<small>О приложении</small></button></div><p id="msg"></p></div><div class="room"><div class="window">☀️<div>⌂　⌂　⌂</div></div><div class="shelf">📚 🧸 🌿<br>🖼️ 🎨 🐰</div><div class="desk"><div class="paper">🦒</div>🖍️ 🖍️ 🖍️</div><div class="plants pl">🌿</div><div class="plants pr">🌿</div><div class="cat">🐈</div><div class="rug">♡</div></div></section>
<section id="studioScreen" class="screen hidden"><div class="head"><button class="button" onclick="home()">← Назад</button><input id="title" class="button" value="Моя раскраска"><button class="button save" onclick="savePNG()">⬇ Сохранить</button></div><div class="studio"><div class="canvasbox"><canvas id="canvas"></canvas><div id="overlay" class="note hidden">Сначала подготовь контуры</div></div><aside class="tools"><div class="tabs"><button id="brushTab" onclick="tool='brush';selectTool()">Кисть</button><button id="fillTab" class="active" onclick="tool='fill';selectTool()">Заливка</button></div><div id="palette" class="palette"></div><label>Размер кисти<input id="size" type="range" min="4" max="60" value="16"></label><button class="tool wide pinktool" onclick="tool='eraser';selectTool()">🧽 Ластик</button><label id="thresholdLabel" class="hidden">Порог контура<input id="threshold" type="range" min="80" max="230" value="180"></label><button id="prepare" class="tool wide greenbutton hidden" onclick="prepare()">Подготовить контуры</button><div class="actions"><button class="tool" onclick="undo()">↶ Отменить</button><button class="tool" onclick="resetCanvas()">✦ Очистить</button></div><p id="studioMsg">Выбери цвет и нажми на область рисунка</p></aside></div></section>
<section id="galleryScreen" class="screen hidden"><div class="head"><button class="button" onclick="home()">← Назад</button><h1>Мои рисунки</h1><button class="button" onclick="openStudio()">Новая раскраска</button></div><div id="gallery" class="gallery"></div></section></div>
<script>
const C=['#f04444','#ff8c42','#ffc857','#ffe38a','#a8d63f','#65c466','#2eaa75','#55d6be','#2d9bf0','#4267d5','#7356d9','#9b55dc','#d65bd4','#f07eb4','#f59ab1','#f3b1b1','#74452f','#a96e45','#c69a72','#8d7666','#303238','#f0f0ee','#fff','#101010'];let tool='fill',color=C[0],source='';let canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),history=[];const demo='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"><rect width="900" height="900" fill="white"/><g fill="white" stroke="#202020" stroke-width="9" stroke-linejoin="round"><path d="M360 210C315 125 365 70 430 145C470 80 535 120 515 205C590 230 635 305 610 385L670 450 615 490 575 425C560 560 555 700 600 790L525 790 475 610 430 790 350 790 370 610C300 560 280 480 300 400L230 450 185 390 285 310C290 260 320 225 360 210Z"/><circle cx="380" cy="250" r="15"/><circle cx="480" cy="250" r="15"/><path d="M385 295Q430 330 475 295" fill="none"/><circle cx="385" cy="450" r="32"/><circle cx="500" cy="520" r="27"/><circle cx="390" cy="585" r="24"/></g></svg>`);function show(id){['homeScreen','studioScreen','galleryScreen'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function home(){show('homeScreen')}function openStudio(){show('studioScreen');if(!source)source=demo;load(source);document.getElementById('overlay').classList.toggle('hidden',!!prepared);document.getElementById('prepare').classList.toggle('hidden',!!prepared);document.getElementById('thresholdLabel').classList.toggle('hidden',!!prepared)}let prepared=true;
function load(src){
  let im=new Image();
  im.onload=()=>{
    let s=Math.min(1,1200/Math.max(im.width,im.height));
    canvas.width=Math.max(1,Math.round(im.width*s));
    canvas.height=Math.max(1,Math.round(im.height*s));
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(im,0,0,canvas.width,canvas.height);
    history=[];
  };
  im.src=src;
}
function selectTool(){
  document.getElementById('brushTab').classList.toggle('active',tool==='brush');
  document.getElementById('fillTab').classList.toggle('active',tool==='fill');
}
function updateEditorControls(){
  document.getElementById('overlay').classList.toggle('hidden',!!prepared);
  document.getElementById('prepare').classList.toggle('hidden',!!prepared);
  document.getElementById('thresholdLabel').classList.toggle('hidden',!!prepared);
}
C.forEach((c,i)=>{
  let b=document.createElement('button');
  b.type='button';
  b.title=c;
  b.style.background=c;
  b.onclick=()=>{
    color=c;
    tool='fill';
    selectTool();
    document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
  };
  document.getElementById('palette').appendChild(b);
  if(i===0)b.classList.add('selected');
});
function pos(e){
  let r=canvas.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(canvas.width-1,Math.floor((e.clientX-r.left)*canvas.width/r.width))),
    y:Math.max(0,Math.min(canvas.height-1,Math.floor((e.clientY-r.top)*canvas.height/r.height)))
  };
}
function snap(){
  history.push(canvas.toDataURL('image/png'));
  if(history.length>20)history.shift();
}
function paint(e){
  if(!prepared)return;
  let p=pos(e);
  if(tool==='fill'){
    snap();
    flood(p.x,p.y,color);
    return;
  }
  snap();
  ctx.beginPath();
  ctx.lineWidth=+size.value*(tool==='eraser'?1.8:1);
  ctx.lineCap='round';
  ctx.strokeStyle=tool==='eraser'?'#fff':color;
  ctx.moveTo(p.x,p.y);
  ctx.lineTo(p.x+.1,p.y+.1);
  ctx.stroke();
}
let drag=false;
canvas.onpointerdown=e=>{
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  paint(e);
  drag=tool!=='fill';
};
canvas.onpointermove=e=>{
  if(!drag||tool==='fill')return;
  e.preventDefault();
  let p=pos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
};
canvas.onpointerup=()=>drag=false;
canvas.onpointercancel=()=>drag=false;
function flood(x,y,fill){
  let im=ctx.getImageData(0,0,canvas.width,canvas.height),d=im.data,w=canvas.width,h=canvas.height;
  let s=(y*w+x)*4,t=[d[s],d[s+1],d[s+2],d[s+3]];
  let m=fill.match(/[a-f\d]{2}/gi).map(v=>parseInt(v,16));
  if(Math.abs(t[0]-m[0])<3&&Math.abs(t[1]-m[1])<3&&Math.abs(t[2]-m[2])<3)return;
  let q=[[x,y]],seen=new Uint8Array(w*h);seen[y*w+x]=1;
  while(q.length){
    let [a,b]=q.pop(),i=(b*w+a)*4;
    if(Math.abs(d[i]-t[0])>35||Math.abs(d[i+1]-t[1])>35||Math.abs(d[i+2]-t[2])>35||Math.abs(d[i+3]-t[3])>35)continue;
    d[i]=m[0];d[i+1]=m[1];d[i+2]=m[2];d[i+3]=255;
    for(let [nx,ny] of [[a-1,b],[a+1,b],[a,b-1],[a,b+1]])
      if(nx>=0&&ny>=0&&nx<w&&ny<h&&!seen[ny*w+nx]){
        seen[ny*w+nx]=1;q.push([nx,ny]);
      }
  }
  ctx.putImageData(im,0,0);
}
function undo(){
  let s=history.pop();
  if(s){
    let current=canvas.toDataURL('image/png');
    let im=new Image();
    im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);};
    im.src=s;
  }
}
function resetCanvas(){load(source);history=[];}
function prepare(){
  if(!source)return;
  let im=new Image();
  im.onload=()=>{
    let s=Math.min(1,1200/Math.max(im.width,im.height));
    canvas.width=Math.max(1,Math.round(im.width*s));
    canvas.height=Math.max(1,Math.round(im.height*s));
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(im,0,0,canvas.width,canvas.height);
    let image=ctx.getImageData(0,0,canvas.width,canvas.height);
    let d=image.data, threshold=+document.getElementById('threshold').value;
    for(let i=0;i<d.length;i+=4){
      let lum=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
      let v=lum>threshold?255:0;
      d[i]=d[i+1]=d[i+2]=v;
      d[i+3]=255;
    }
    ctx.putImageData(image,0,0);
    prepared=true;
    history=[];
    tool='fill';
    selectTool();
    updateEditorControls();
    document.getElementById('studioMsg').textContent='Готово! Выбери цвет и нажми на область рисунка.';
  };
  im.src=source;
}
function savePNG(){if(document.getElementById('studioScreen').classList.contains('hidden'))return;let a=document.createElement('a');a.download=(title.value||'little-cozy-world')+'.png';a.href=canvas.toDataURL();a.click();let arr=JSON.parse(localStorage.getItem('lcw')||'[]');arr=[{id:Date.now(),name:title.value,data:canvas.toDataURL()},...arr.filter(x=>x.name!==title.value)].slice(0,30);localStorage.setItem('lcw',JSON.stringify(arr));document.getElementById('studioMsg').textContent='Готово! PNG сохранён.'}function gallery(){show('galleryScreen');let g=document.getElementById('gallery'),arr=JSON.parse(localStorage.getItem('lcw')||'[]');g.innerHTML=arr.length?arr.map(x=>`<article class="card"><img src="${x.data}"><h3>${x.name}</h3><button onclick="source='${x.data}';title.value='${x.name}';prepared=true;openStudio()">Открыть</button></article>`).join(''):'<div class="note">Пока нет сохранённых рисунков. Раскрась первую картинку!</div>'}file.onchange=async e=>{
  let f=e.target.files[0];
  if(!f)return;
  source=await new Promise(r=>{
    let x=new FileReader();
    x.onload=()=>r(x.result);
    x.readAsDataURL(f);
  });
  prepared=false;
  show('studioScreen');
  load(source);
  updateEditorControls();
  title.value=f.name.replace(/\.[^.]+$/,'')||'Моя раскраска';
  document.getElementById('studioMsg').textContent='Подготавливаем картинку для заливки…';
  e.target.value='';
  // Автоматически готовим новую картинку, чтобы заливка работала сразу.
  setTimeout(()=>{
    if(source) prepare();
  },120);
};
</script>
