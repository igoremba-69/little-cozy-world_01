<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Cozy World</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6eddf;color:#202735;font-family:Arial,sans-serif}
button,input{font:inherit}.app{min-height:100vh;padding:14px;background-image:radial-gradient(#b9dce4 2px,transparent 2px);background-size:28px 28px}
.top{max-width:1450px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.logo{border:0;background:none;text-align:left;cursor:pointer;font-weight:900;line-height:.8;filter:drop-shadow(2px 3px white)}.logo small{display:block;color:#45aede;font-size:20px}.logo b{font-size:42px;color:#ffbd37;-webkit-text-stroke:2px #273b62}.logo em{font-style:normal;color:#b56ee1}.button{border:0;border-radius:17px;padding:12px 18px;background:#fff;box-shadow:0 4px #cdbda9;font-weight:800;cursor:pointer}.button:active,.item:active,.tool:active{transform:translateY(2px);box-shadow:0 2px #cdbda9}.save{background:#65ad92;color:#fff}.top-actions{display:flex;gap:8px}
.home{max-width:1450px;margin:18px auto;display:grid;grid-template-columns:430px 1fr;gap:25px}.menu{display:flex;flex-direction:column;gap:13px}.note{background:#fff8e8;padding:15px 18px;border-radius:18px;box-shadow:0 4px #e2d3bd}.item{display:flex;align-items:center;gap:14px;border:4px solid #fff;border-radius:24px;padding:15px 18px;box-shadow:0 5px #cbbba8;font-size:24px;font-weight:900;text-align:left;cursor:pointer}.item span{flex:1}.item small{display:block;font-size:13px;font-weight:500;margin-top:4px}.pink{background:#f59bad}.yellow{background:#ffd57c}.green{background:#9be0b5}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.mini button{border:0;background:#fff;padding:12px 4px;border-radius:15px;box-shadow:0 3px #d3c3b0;cursor:pointer}.mini small{display:block;font-size:12px;margin-top:5px}.room{min-height:650px;border:8px solid #c89467;border-radius:25px;background:linear-gradient(#fff7e8 0 59%,#c99b6e 59%);position:relative;overflow:hidden;box-shadow:0 9px #bba18a}.window{position:absolute;left:17%;right:17%;top:7%;height:35%;border:13px solid #b87847;background:linear-gradient(#65c5ef 0 65%,#9bd77a 65%);font-size:55px;text-align:right;padding:10px}.shelf{position:absolute;left:6%;top:8%;background:#a56c42;color:white;padding:12px 20px;border-radius:12px;font-size:30px;line-height:1.8}.desk{position:absolute;left:24%;right:17%;bottom:22%;height:155px;background:#b97943;border:8px solid #8b552f;border-radius:15px;padding:22px;transform:rotate(-2deg)}.paper{width:145px;height:88px;background:#fff8df;text-align:center;padding:18px;font-size:45px}.plants{position:absolute;bottom:20%;font-size:78px}.pl{left:4%}.pr{right:3%}.cat{position:absolute;bottom:8%;left:45%;font-size:90px}.rug{position:absolute;bottom:2%;left:31%;width:40%;height:70px;border-radius:50%;background:#efb0b9;text-align:center;font-size:50px;color:white}
.screen{max-width:1450px;margin:20px auto}.head{display:flex;gap:10px;align-items:center;margin-bottom:16px}.head h1{flex:1;margin:0}.studio{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}.canvasbox{background:#fff;border-radius:24px;padding:12px;min-height:600px;display:flex;align-items:center;justify-content:center;box-shadow:0 5px #d7c6b3;overflow:hidden}.canvaswrap{position:relative;max-width:100%;line-height:0}.canvaswrap canvas{display:block;max-width:100%;width:auto;height:auto;touch-action:none}.canvaswrap #paint{position:absolute;inset:0}.tools{background:#fffaf2;border-radius:24px;padding:15px;box-shadow:0 5px #d7c6b3}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tabs button,.tool{border:0;border-radius:13px;padding:12px;background:#eee5d9;font-weight:800;cursor:pointer}.tabs .active{background:#c8b5ff}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}.palette button{aspect-ratio:1;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px #0002;cursor:pointer;padding:0}.palette button.selected{outline:3px solid #333;outline-offset:2px}.tools label{display:block;font-weight:800;font-size:13px;margin:13px 0}.tools input{width:100%}.wide{width:100%;margin-top:10px}.pinktool{background:#f6b0bb}.greenbutton{background:#9cdbb5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}.card{background:#fff;border-radius:20px;padding:12px;box-shadow:0 5px #d7c6b3}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card button{padding:8px;border:0;border-radius:10px;margin-right:5px}.hidden{display:none!important}#msg,#studioMsg{font-size:13px;color:#6d6258}
@media(max-width:850px){.top{align-items:flex-start}.top-actions{flex-direction:column}.home{grid-template-columns:1fr}.room{min-height:430px;order:-1}.studio{grid-template-columns:1fr}.canvasbox{min-height:0;padding:8px}.canvaswrap{width:100%}.canvaswrap canvas{width:100%;height:auto}.tools{padding:12px}.palette{grid-template-columns:repeat(8,1fr);gap:5px}.logo b{font-size:32px}.head{flex-wrap:wrap}.head h1{order:3;width:100%;flex:auto}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="logo" id="homeBtn"><small>Little</small><b>Cozy <em>World</em></b></button>
<div class="top-actions"><button class="button" id="addTop">📁 Добавить картинку</button><button class="button save" id="saveTop">Сохранить PNG</button></div>
</header>
<input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden>

<section id="homeScreen" class="home">
<div class="menu">
<div class="note">Твой уютный мир раскрасок</div>
<button class="item pink" id="paintMenu">🎨<span>Раскрашивать<small>Создавай свои шедевры!</small></span>›</button>
<button class="item yellow" id="galleryMenu">🖼️<span>Мои рисунки<small>Смотри и сохраняй</small></span>›</button>
<button class="item green" id="newMenu">🐱<span>Новые картинки<small>Открывай и раскрашивай</small></span>›</button>
<div class="mini"><button id="settings">⚙<small>Настройки</small></button><button id="parents">👨‍👩‍👧<small>Для родителей</small></button><button id="about">ⓘ<small>О приложении</small></button></div>
<p id="msg"></p>
</div>
<div class="room"><div class="window">☀️<div>⌂　⌂　⌂</div></div><div class="shelf">📚 🧸 🌿<br>🖼️ 🎨 🐰</div><div class="desk"><div class="paper">🦒</div>🖍️ 🖍️ 🖍️</div><div class="plants pl">🌿</div><div class="plants pr">🌿</div><div class="cat">🐈</div><div class="rug">♡</div></div>
</section>

<section id="studioScreen" class="screen hidden">
<div class="head"><button class="button" id="backStudio">← Назад</button><input id="title" class="button" value="Моя раскраска"><button class="button save" id="saveStudio">⬇ Сохранить</button></div>
<div class="studio">
<div class="canvasbox"><div class="canvaswrap"><canvas id="art" width="900" height="900"></canvas><canvas id="paint" width="900" height="900"></canvas></div></div>
<aside class="tools">
<div class="tabs"><button id="brushTab">Кисть</button><button id="fillTab" class="active">Заливка</button></div>
<div id="palette" class="palette"></div>
<label>Размер кисти<input id="size" type="range" min="4" max="70" value="16"></label>
<button class="tool wide pinktool" id="eraser">🧽 Ластик</button>
<div class="actions"><button class="tool" id="undo">↶ Отменить</button><button class="tool" id="clear">✦ Очистить</button></div>
<p id="studioMsg">Выбери цвет и нажми на область рисунка.</p>
</aside></div>
</section>

<section id="galleryScreen" class="screen hidden"><div class="head"><button class="button" id="backGallery">← Назад</button><h1>Мои рисунки</h1><button class="button" id="newGallery">Новая раскраска</button></div><div id="gallery" class="gallery"></div></section>
</div>
<script>
const colors=['#f04444','#ff8c42','#ffc857','#ffe38a','#a8d63f','#65c466','#2eaa75','#55d6be','#2d9bf0','#4267d5','#7356d9','#9b55dc','#d65bd4','#f07eb4','#f59ab1','#f3b1b1','#74452f','#a96e45','#c69a72','#8d7666','#303238','#f0f0ee','#ffffff','#101010'];
const art=document.getElementById('art'), paint=document.getElementById('paint'), actx=art.getContext('2d'), pctx=paint.getContext('2d',{willReadFrequently:true});
let mode='fill', color=colors[0], source='', lineData='', history=[], drawing=false, last=null;

function show(id){['homeScreen','studioScreen','galleryScreen'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function setMode(m){mode=m;document.getElementById('brushTab').classList.toggle('active',m==='brush');document.getElementById('fillTab').classList.toggle('active',m==='fill');}
function makeDemo(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900"><rect width="900" height="900" fill="white"/><g fill="white" stroke="#202020" stroke-width="9" stroke-linejoin="round"><path d="M360 210C315 125 365 70 430 145C470 80 535 120 515 205C590 230 635 305 610 385L670 450 615 490 575 425C560 560 555 700 600 790L525 790 475 610 430 790 350 790 370 610C300 560 280 480 300 400L230 450 185 390 285 310C290 260 320 225 360 210Z"/><circle cx="380" cy="250" r="15"/><circle cx="480" cy="250" r="15"/><path d="M385 295Q430 330 475 295" fill="none"/><circle cx="385" cy="450" r="32"/><circle cx="500" cy="520" r="27"/><circle cx="390" cy="585" r="24"/></g></svg>')}
function fitCanvas(w,h){const s=Math.min(1,1200/Math.max(w,h));art.width=paint.width=Math.max(1,Math.round(w*s));art.height=paint.height=Math.max(1,Math.round(h*s))}
function loadImage(src,asLine=false){const im=new Image();im.onload=()=>{fitCanvas(im.width,im.height);actx.clearRect(0,0,art.width,art.height);actx.drawImage(im,0,0,art.width,art.height);lineData=art.toDataURL('image/png');pctx.clearRect(0,0,paint.width,paint.height);history=[];};im.src=src}
function openStudio(){show('studioScreen');if(!source){source=makeDemo();loadImage(source)}else if(!lineData)loadImage(source);document.getElementById('studioMsg').textContent='Выбери цвет и нажми на область рисунка.'}
function pos(e){const r=paint.getBoundingClientRect();return{x:Math.max(0,Math.min(paint.width-1,Math.floor((e.clientX-r.left)*paint.width/r.width))),y:Math.max(0,Math.min(paint.height-1,Math.floor((e.clientY-r.top)*paint.height/r.height)))}}
function snapshot(){history.push(pctx.getImageData(0,0,paint.width,paint.height));if(history.length>25)history.shift()}
function restore(){const im=history.pop();if(im)pctx.putImageData(im,0,0)}
function hexRGB(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function isLine(x,y){const d=actx.getImageData(x,y,1,1).data;return d[3]>0&&d[0]<150&&d[1]<150&&d[2]<150}
function flood(x,y){
 const w=paint.width,h=paint.height, pix=pctx.getImageData(0,0,w,h),d=pix.data, fill=hexRGB(color), seen=new Uint8Array(w*h), q=[[x,y]];
 const start=(y*w+x)*4, base=[d[start],d[start+1],d[start+2],d[start+3]];
 if(isLine(x,y))return;
 if(base[3]===255&&Math.abs(base[0]-fill[0])<2&&Math.abs(base[1]-fill[1])<2&&Math.abs(base[2]-fill[2])<2)return;
 while(q.length){const [cx,cy]=q.pop(),idx=cy*w+cx,i=idx*4;if(seen[idx]||isLine(cx,cy))continue;seen[idx]=1;d[i]=fill[0];d[i+1]=fill[1];d[i+2]=fill[2];d[i+3]=255;
 [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]].forEach(([nx,ny])=>{if(nx>=0&&ny>=0&&nx<w&&ny<h&&!seen[ny*w+nx])q.push([nx,ny])})}
 pctx.putImageData(pix,0,0)
}
function drawBrush(e){const p=pos(e);pctx.beginPath();pctx.lineCap='round';pctx.lineJoin='round';pctx.lineWidth=+document.getElementById('size').value;pctx.strokeStyle=mode==='eraser'?'rgba(0,0,0,0)':color;if(mode==='eraser')pctx.globalCompositeOperation='destination-out';else pctx.globalCompositeOperation='source-over';pctx.moveTo(last.x,last.y);pctx.lineTo(p.x,p.y);pctx.stroke();pctx.globalCompositeOperation='source-over';last=p}
paint.addEventListener('pointerdown',e=>{e.preventDefault();paint.setPointerCapture(e.pointerId);if(mode==='fill'){snapshot();flood(...Object.values(pos(e)));return}snapshot();drawing=true;last=pos(e);drawBrush(e)});
paint.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();drawBrush(e)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>paint.addEventListener(ev,()=>{drawing=false;last=null}));

colors.forEach((c,i)=>{const b=document.createElement('button');b.type='button';b.style.background=c;b.title=c;b.onclick=()=>{color=c;setMode('fill');document.querySelectorAll('#palette button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};document.getElementById('palette').appendChild(b);if(i===0)b.classList.add('selected')});
document.getElementById('brushTab').onclick=()=>setMode('brush');document.getElementById('fillTab').onclick=()=>setMode('fill');document.getElementById('eraser').onclick=()=>setMode('eraser');
document.getElementById('undo').onclick=restore;document.getElementById('clear').onclick=()=>{snapshot();pctx.clearRect(0,0,paint.width,paint.height)};
function savePNG(){const c=document.createElement('canvas');c.width=art.width;c.height=art.height;const x=c.getContext('2d');x.drawImage(art,0,0);x.drawImage(paint,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(document.getElementById('title').value||'little-cozy-world')+'.png';a.click()}
function readFile(file){const reader=new FileReader();reader.onload=()=>{source=reader.result;lineData='';document.getElementById('title').value=file.name.replace(/\.[^.]+$/,'')||'Моя раскраска';openStudio();loadImage(source)};reader.readAsDataURL(file)}
document.getElementById('file').onchange=e=>{if(e.target.files[0])readFile(e.target.files[0]);e.target.value=''};
document.getElementById('homeBtn').onclick=()=>show('homeScreen');document.getElementById('addTop').onclick=()=>document.getElementById('file').click();document.getElementById('saveTop').onclick=savePNG;document.getElementById('paintMenu').onclick=openStudio;document.getElementById('newMenu').onclick=()=>document.getElementById('file').click();document.getElementById('galleryMenu').onclick=()=>{show('galleryScreen');renderGallery()};document.getElementById('backStudio').onclick=()=>show('homeScreen');document.getElementById('backGallery').onclick=()=>show('homeScreen');document.getElementById('newGallery').onclick=openStudio;
document.getElementById('settings').onclick=()=>alert('Настройки будут добавлены следующим этапом');document.getElementById('parents').onclick=()=>alert('Родительский режим будет добавлен следующим этапом');document.getElementById('about').onclick=()=>alert('Little Cozy World — классический MVP');
function renderGallery(){const el=document.getElementById('gallery');el.innerHTML='<div class="note">Сохранение рисунков в библиотеку добавим следующим этапом.</div>'}
</script>
</body>
</html>
